[project]
name = "world"
version = "0.2.0"
description = "World of Vibrations — 3D physics simulator toward emergent brain-like structure (Phase 1 v2)."
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "VibraSim contributors" }]
dependencies = [
    "numpy >= 1.26, <3.0",
    "numba >= 0.61, <0.70",
    "pyvista >= 0.45, <1.0",
    "optuna >= 4.0, <5.0",
    "yt-dlp>=2026.3.17",
    "librosa>=0.11.0",
    "pypdf>=4.0",          # read .pdf sources in the conversation/web GUI (tools/web_gui.py, world/ingest.py)
]

[project.optional-dependencies]
dev = ["pytest >= 8.0", "matplotlib >= 3.8", "scipy >= 1.11, < 2.0"]
dashboard = [
    "streamlit >= 1.40",
    "psycopg[binary] >= 3.2",
    "pandas >= 2.2",
    "reportlab >= 4.2",
    "plotly >= 5.24",
]
agent = [
    "sounddevice>=0.4,<1.0",
    "opencv-python-headless>=4.9,<5.0",
    "yt-dlp>=2024.0",
]

[project.scripts]
world = "world.run:main"
vibrasim2-view = "vibrasim2.wireframe:main"
vibrasim2-p0 = "vibrasim2.p0.cli:main"
vibrasim2-p1 = "vibrasim2.p1.cli:main"
vibrasim2-p2 = "vibrasim2.p2.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["world", "vibrasim2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers -m 'not experiment and not slow and not external and not resource_intensive and not gui'"
markers = [
    "slow: unsuitable for the fast feedback loop",
    "experiment: executes or evaluates a scientific research run",
    "external: requires network, hardware, a user data set, notification service, or home-directory state",
    "resource_intensive: requests hour-scale runtime or unusually large memory/CPU resources",
    "gui: requires a real display and graphics stack",
]
